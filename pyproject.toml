[project]
name = "patreon-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "selenium~=4.45.0",
    "python-dotenv~=1.2.2",
    "requests~=2.34.2",
    "aiohttp~=3.14.1",
    "pillow~=11.3.0",
    "asyncio~=3.4.3",    
]

[dependency-groups]
dev = [
    "pytest~=8.4.2",
    "pylint~=3.3.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]